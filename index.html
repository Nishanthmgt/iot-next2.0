<body>
  <div id="root"></div>
  <style>
    #smart-loader {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: white;
      transition: opacity 0.5s ease;
    }

    .loader-ring {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #recovery-option {
      display: none;
      margin-top: 2rem;
      text-align: center;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reset-btn {
      padding: 0.6rem 1.2rem;
      background: rgba(99, 102, 241, 0.1);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #6366f1;
      color: white;
    }
  </style>

  <div id="smart-loader">
    <div class="loader-ring"></div>
    <div
      style="margin-top: 1.25rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 0.75rem; color: #64748b;">
      Loading IoTNext</div>
    <div id="recovery-option">
      <p style="font-size: 0.8rem; color: #475569; margin-bottom: 0.75rem;">Still loading? Try refreshing.</p>
      <button class="reset-btn" id="reset-btn" onclick="resetAndRefresh()">Reset & Refresh</button>
    </div>
  </div>

  <script>
    (function () {
      const root = document.getElementById('root');
      const loader = document.getElementById('smart-loader');
      const recovery = document.getElementById('recovery-option');

      const checkInterval = setInterval(() => {
        if (root && root.innerHTML !== '') {
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
          clearInterval(checkInterval);
        }
      }, 100);

      // Show recovery button only after 12 seconds
      setTimeout(() => {
        if (loader && document.body.contains(loader)) {
          recovery.style.display = 'block';
        }
      }, 12000);

      window.resetAndRefresh = async function () {
        const btn = document.querySelector('.reset-btn');
        if (btn) btn.innerText = 'Clearing System...';

        try {
          localStorage.clear();
          sessionStorage.clear();

          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (let r of regs) await r.unregister();
          }

          if ('caches' in window) {
            const keys = await caches.keys();
            for (let k of keys) await caches.delete(k);
          }

          window.location.replace('/');
        } catch (e) {
          window.location.reload();
        }
      };
    })();
  </script>
